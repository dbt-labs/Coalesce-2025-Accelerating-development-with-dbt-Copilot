models:
- name: source_to_target_example
  description: This model consolidates order items, orders, and product details to
    provide a comprehensive view of each order, including product pricing and supply
    cost analysis. It calculates the supply cost percentage relative to the product
    price, offering insights into cost management for each product sold.
  columns:
  - name: order_item_id
    description: Unique identifier for each order item.
    data_tests:
      - unique
      - not_null
  - name: order_id
    description: Unique identifier for each order.
    data_tests:
      - not_null
  - name: product_id
    description: Unique identifier for each product.
    data_tests:
      - not_null
  - name: order_date
    description: The date when the order was placed.
  - name: product_name
    description: The name of the product.
  - name: product_price
    description: The price of the product.
  - name: is_food_item
    description: Indicates whether the product is a food item.
  - name: is_drink_item
    description: Indicates whether the product is a drink item.
  - name: supply_cost
    description: The total supply cost associated with the product.
  - name: supply_cost_percentage
    description: The percentage of the supply cost relative to the product price.