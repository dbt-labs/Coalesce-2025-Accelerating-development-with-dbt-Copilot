models:
- name: source_to_target_example
  description: This model consolidates order items, orders, and product details to
    provide a comprehensive view of each order item, including its associated order
    date, product details, and supply cost information. It calculates the supply cost
    as a percentage of the product price, which can be useful for analyzing cost efficiency
    and pricing strategies.
  columns:
  - name: order_item_id
    description: A unique identifier for each order item.
    data_tests:
      - unique
      - not_null
  - name: order_id
    description: A unique identifier for each order associated with the order item.
    data_tests:
      - not_null
  - name: product_id
    description: A unique identifier for each product associated with the order item.
    data_tests:
      - not_null
  - name: order_date
    description: The date when the order was placed.
  - name: product_name
    description: The name of the product associated with the order item.
  - name: product_price
    description: The price of the product associated with the order item.
  - name: is_food_item
    description: Indicates whether the product is a food item.
  - name: is_drink_item
    description: Indicates whether the product is a drink item.
  - name: supply_cost
    description: The total supply cost associated with the product.
  - name: supply_cost_percentage
    description: The supply cost expressed as a percentage of the product price.