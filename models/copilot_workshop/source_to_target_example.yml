models:
- name: source_to_target_example
  description: This model consolidates order items, orders, products, and supply costs
    to provide a comprehensive view of each order item, including its associated product
    details and supply cost percentage. It is useful for analyzing the cost structure
    and profitability of products sold.
  columns:
  - name: order_item_id
    description: A unique identifier for each order item.
    data_tests:
      - unique
      - not_null
  - name: order_id
    description: A unique identifier for each order.
    data_tests:
      - not_null
  - name: product_id
    description: A unique identifier for each product.
    data_tests:
      - not_null
  - name: order_date
    description: The date when the order was placed.
  - name: product_name
    description: The name of the product.
  - name: product_price
    description: The price at which the product is sold.
  - name: is_food_item
    description: Indicates whether the product is a food item.
  - name: is_drink_item
    description: Indicates whether the product is a drink item.
  - name: total_supply_cost
    description: The total cost of supplies for the product.
  - name: supply_cost_percentage
    description: The percentage of the product's price that is attributed to supply
      costs.
