models:
  - name: order_items
    config:
      group: analytics_engineering
      meta:
        owner: analytics_engineering
    columns:
      - name: order_item_id
        data_tests:
          - not_null
          - unique
      - name: order_id
        data_tests:
          - relationships:
              arguments:
                to: ref('orders')
                field: order_id