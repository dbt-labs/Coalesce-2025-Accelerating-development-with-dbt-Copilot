models:
  - name: daily_location_performance
    description: Daily performance summary per location, offering total revenue, order count, and a food vs. drink revenue split. One row per location per day.
    config:
      group: analytics_engineering
      meta:
        owner: analytics_engineering
    data_tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: "food_revenue + drink_revenue + other_revenue = total_revenue"
    columns:
      - name: daily_location_performance_key
        description: Surrogate primary key, generated from location_id and order_date.
        data_tests:
          - not_null
          - unique
      - name: location_id
        description: The foreign key relating to the location this summary row is for.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('locations')
                field: location_id
      - name: location_name
        description: The name of the location.
      - name: order_date
        description: The date this summary row represents.
        data_tests:
          - not_null
      - name: count_orders
        description: The number of orders placed at this location on this date.
      - name: total_revenue
        description: The sum of all order revenue (pre-tax, pre-supply-cost) at this location on this date.
      - name: food_revenue
        description: The portion of total_revenue attributable to food items.
      - name: drink_revenue
        description: The portion of total_revenue attributable to drink items.
      - name: other_revenue
        description: The portion of total_revenue attributable to items that are neither food nor drink. Always 0 today, since every product in this dataset is classified as either food or drink - kept so the model doesn't silently misclassify revenue if a non-food/drink product type is ever added.

unit_tests:
  - name: test_food_and_drink_revenue_split_correctly
    description: "Test that item-level revenue is split into food/drink/other buckets without double-counting an order that contains both."
    model: daily_location_performance
    overrides:
      macros:
        is_incremental: false
    given:
      - input: ref('order_items')
        rows:
          - {order_id: 1, order_item_id: 1, product_price: 5.00, is_food_item: true, is_drink_item: false}
          - {order_id: 1, order_item_id: 2, product_price: 3.00, is_food_item: false, is_drink_item: true}
      - input: ref('orders')
        rows:
          - {order_id: 1, location_id: 1, order_date: "2026-01-01"}
      - input: ref('locations')
        rows:
          - {location_id: 1, location_name: "Vice City"}
    expect:
      rows:
        - {location_id: 1, location_name: "Vice City", order_date: "2026-01-01", count_orders: 1, total_revenue: 8.00, food_revenue: 5.00, drink_revenue: 3.00, other_revenue: 0.00}